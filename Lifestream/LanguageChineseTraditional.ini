WARNING - use at your own risk. This writes your character's coordinates straight into game memory to teleport you instantly. It is not something the normal client ever does, the server can detect it, and it may get your account actioned.==警告 —— 使用者自行承擔風險。這會把你的角色座標直接寫進遊戲記憶體來達成瞬移。這不是原版客戶端會做的事，伺服器偵測得到，可能導致帳號受罰。
DailyRoutines, where this feature comes from, keeps its own list of zones with server-side movement-speed detection, and on the CN/TC clients it refuses to position-teleport inside those zones unless the account is premium - that is their own evidence that it is detectable.==這個功能的來源 DailyRoutines 自己維護了一份「有伺服器端移動速度偵測」的區域清單，而且在國服／台服，非付費帳號在那些區域內一律不准用座標瞬移 —— 那本身就是他們知道會被偵測到的證據。
It is refused automatically while in a duty, in combat, casting, or zoning, and falls back to walking.==在副本中、戰鬥中、詠唱中或區域轉換中會自動拒絕，並退回步行前往。
Saved landing positions==已儲存的落點
Teleport to the aethernet shard you are standing on==傳送到目前所在的乙太之光
The game refuses an aethernet teleport when the destination is the shard you are already standing at ("This is your current location."). This option patches that check out, which is useful together with custom landing positions - you can re-teleport to snap back to your saved spot.==當目的地就是你現在站的那座乙太之光時，遊戲會拒絕傳送（「此處為目前所在地。」）。這個選項會把該判斷修掉。搭配自訂落點很實用 —— 可以重新傳送一次讓自己回到儲存的位置。
WARNING - use at your own risk. This is a memory patch: it rewrites two bytes of the game's code so it stops refusing, and the client then sends a teleport request the unmodified client would never send. Off by default.==警告 —— 使用者自行承擔風險。這是記憶體修補：它改寫遊戲程式碼中的兩個位元組讓它不再拒絕，之後客戶端會送出原版客戶端絕不會送出的傳送請求。預設關閉。
The "you have not attuned to this aetheryte" check is left untouched. The patch is verified before it is written: each signature must match exactly once and the byte found must be the expected conditional jump, otherwise nothing is patched at all. The original bytes are restored when you turn this off or unload the plugin.==「尚未共鳴，無法傳送。」的檢查完全不動。寫入前會先驗證：每條特徵碼必須剛好命中一次，而且該位址上的位元組必須是預期的條件跳躍，否則完全不修補。關閉此選項或卸載外掛時會還原原始位元組。
Allow teleporting to the aethernet shard you are standing on==允許傳送到目前所在的乙太之光
