Take the aethernet first when it saves at least, yalms==落點至少近這麼多距離時，先搭都市傳送網過去
When your landing spot is much closer to one of the city's aethernet shards than to the aetheryte you teleported to, Lifestream rides the aethernet there first and only walks the last stretch - that is the difference between crossing Solution Nine on foot and a short walk. 0 turns this off and always walks the whole way. Straight-line distance, not path length. Needs vnavmesh; without it the spot is just flagged on the map as before.==當落點離城內某座乙太之光比離你剛傳送到的主水晶近上這麼多碼時，Lifestream 會先搭都市傳送網過去，只用走的完成最後一段——在九號解決方案這種大城，那是「橫跨整張地圖用走的」與「走幾步就到」的差別。0 表示關閉，一律從主水晶一路走過去。比的是直線距離，不是實際路徑長度。需要 vnavmesh；沒有它時仍照舊只在地圖上標記旗點。
Arrival Announcement==抵達提醒
Ask Tataru to announce arrival==抵達時請塔塔露提醒（需安裝 TataruPraise）
When a /li teleport or navigation chain runs all the way through and you have actually arrived, Lifestream asks TataruPraise to say one short line. It stays quiet when the chain is aborted or times out, and when auto-movement fails to reach the destination. Without TataruPraise installed this does nothing.==當 /li 的傳送或導航整條跑完、而且真的走到目的地時，Lifestream 會請「塔塔露誇獎」念一句短通知。中途被中止、逾時，或自動移動沒能走到目的地時都不會出聲。沒安裝「塔塔露誇獎」時這個選項什麼都不會做。
