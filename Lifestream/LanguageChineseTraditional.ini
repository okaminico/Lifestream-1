Applies to custom landing positions and "/li goto". Uses the same mount settings as above. Whether mounting is possible at all is left to the game - in a city, indoors, in combat or in a duty it simply walks instead.==適用於自訂落點與「/li goto」，使用與上面相同的坐騎設定。能不能召喚坐騎交給遊戲自己判斷 —— 在城裡、室內、戰鬥中或副本裡就直接用走的。
Minimum path length to mount, yalms==召喚坐騎的最短路徑長度
Recover when movement gets stuck==移動卡住時自動脫困
When auto-moving stops making progress for a few seconds, Lifestream jumps, and if that does not help it recalculates the path from where you are standing. It only ever runs when you are already stuck - without it the character keeps pushing against the obstacle until the 30 second timeout throws the whole trip away.==自動移動時若連續數秒沒有前進，Lifestream 會先跳一下；還是過不去就從目前所在位置重新計算路徑。這只在你已經卡住時才會執行 —— 沒有它的話，角色會一直頂著障礙物推，直到 30 秒逾時把整趟行程作廢。
Maximum recovery attempts per path==每段路徑最多脫困次數
Jumping and recalculating are used alternately. Once these are used up the previous behaviour takes over, so terrain that genuinely cannot be passed still fails instead of looping forever.==跳躍與重算路徑會交替使用。次數用完後就回到原本的行為，所以真正過不去的地形仍然會照舊失敗，不會永遠原地重試。
Shorter paths are walked - getting on and off a mount costs more time than it saves. This is the length of the actual path, not the straight-line distance.==比這個短的路徑一律用走的 —— 上下坐騎花的時間比省下來的還多。這裡看的是實際路徑長度，不是直線距離。
Open favorites window==開啟我的最愛視窗
The favorites window ("/li fav") is a separate list where you can put your favorites in your own order and sort them into your own categories. The teleport panel itself is unchanged.==我的最愛視窗（「/li fav」）是另一份清單，可以把我的最愛排成自己想要的順序、分進自己的分類。傳送面板本身完全沒有改變。
/li fav → open the favorites window (custom order and categories), alias: /li fav|favorites==/li fav → 開啟我的最愛視窗（自訂排序與分類），別名：/li fav|favorites
Destinations shown / entries in your favorites. They differ when some favorites are not attuned on this character, or belong to the residential / Eureka aethernet lists in the overlay - see "Not available" at the bottom.==顯示中的目的地／我的最愛總筆數。兩者不同代表有些我的最愛在這隻角色上還沒共鳴，或屬於浮動視窗管理的住宅區／優雷卡乙太之光清單 —— 見最下方的「目前無法使用」。
favorites belong to the residential / Eureka / Occult Crescent aethernet lists, which are managed from the Lifestream overlay - they are not shown or edited here.==筆我的最愛屬於住宅區／優雷卡／新月島乙太之光清單，那些由 Lifestream 浮動視窗管理，不會在這裡顯示或編輯。
Walk instead of using the aethernet when closer than, yalms==目的地比此距離近時改用走的（不用都市傳送網）
0 turns this off (default). When the destination aethernet shard is in the zone you are already in and closer than this, Lifestream simply walks there instead of taking the aethernet - that saves a whole loading screen. Straight-line distance, not path length. If it cannot walk there in time it falls back to the normal aethernet route.==設為 0 即關閉（預設）。當目的地乙太之光就在你目前所在的區域、而且比這個距離近時，Lifestream 會直接走過去而不使用都市傳送網 —— 這樣可以省下整整一次讀取畫面。比的是直線距離，不是實際路徑長度。若在時限內走不到，會自動退回原本的都市傳送網流程。
Landed too far from every aethernet shard, and Lifestream could not work out where the nearest one is.==落地點離所有乙太之光都太遠，而 Lifestream 算不出最近的那一座在哪裡。
