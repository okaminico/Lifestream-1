Imports favorites, remarks and custom landing positions from DailyRoutines' BetterTeleport module. Both plugins key this data by aetheryte row id, so it transfers 1:1. Existing entries are never overwritten.==從 DailyRoutines 的 BetterTeleport 模組匯入我的最愛、備註與自訂落點。兩邊都以乙太之光的資料表 RowId 為鍵，所以是 1:1 對應。已存在的項目不會被覆蓋。
