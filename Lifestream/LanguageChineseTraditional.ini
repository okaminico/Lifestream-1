Custom landing positions==自訂落點
You can save a custom landing spot for each aetheryte. After teleporting there, Lifestream will bring you to that spot instead of leaving you at the crystal. Set them from the right-click menu in the teleport panel.==可以為每座乙太之光記錄一個自訂落點。傳送過去之後，Lifestream 會再把你帶到那個位置，而不是把你留在水晶旁。在傳送面板中按右鍵即可設定。
Enable custom landing positions==啟用自訂落點
Off by default. When enabled, the safe route is used: normal teleport, then vnavmesh walks you to the spot. Nothing is written to game memory.==預設關閉。啟用後走的是安全路徑：正常傳送之後，由 vnavmesh 走過去，不會寫入任何遊戲記憶體。
Safe mode: teleport + vnavmesh pathfinding. If vnavmesh is not installed the spot is flagged on your map instead.==安全模式：傳送 + vnavmesh 尋路。沒有安裝 vnavmesh 時改為在地圖上標記旗點。
